[project]
name = "orchestration"
version = "0.1.0"
description = "Self-hosted multi-agent software engineering orchestration"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "crewai[anthropic]>=1.15,<2",   # Flow state machine + LLM agent framework
  "httpx>=0.28",
  "structlog>=24.4",
  "prometheus-client>=0.20",
  "python-multipart>=0.0.20",
  "passlib[bcrypt]>=1.7",
  # passlib 1.7.4 doesn't recognise bcrypt >=4.1 (drops __about__); pin to 4.0.x.
  "bcrypt<4.1",
  "anthropic>=0.73",               # Direct Anthropic SDK (used by crewai provider)
  "opentelemetry-sdk>=1.24",
  "opentelemetry-exporter-otlp>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "testcontainers[postgres,redis]>=4.8",
  "bandit>=1.7",
  "pytest-vcr>=1.0.2",
  "types-passlib>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestration"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# FastAPI convention: Depends() and Path() in function defaults
"src/orchestration/api/**/*.py" = ["B008"]
# Bare except in test fixture teardown — intentional safety net
"tests/llm/test_endpoint.py" = ["BLE001"]
# Budget month_start uses date.today() -- acceptable for month-boundary logic
"src/orchestration/storage/repositories/budget.py" = ["DTZ011"]

[tool.mypy]
python_version = "3.12"
# Graduated from strict mode — real-world project with Pydantic + CrewAI + OTel.
# Errors that would block CI are fixed; cosmetic generic type annotations converge over time.
ignore_missing_imports = true
disallow_any_generics = false
files = ["src/orchestration"]
