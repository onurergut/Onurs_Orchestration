[project]
name = "orchestration"
version = "0.1.0"
description = "Self-hosted multi-agent software engineering orchestration"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "crewai>=0.86",
  "crewai-tools>=0.17",
  "httpx>=0.28",
  "structlog>=24.4",
  "python-multipart>=0.0.20",
  "passlib[bcrypt]>=1.7",
  # passlib 1.7.4 doesn't recognise bcrypt >=4.1 (drops __about__); pin to 4.0.x.
  "bcrypt<4.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "testcontainers[postgres,redis]>=4.8",
  "bandit>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestration"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/orchestration"]
