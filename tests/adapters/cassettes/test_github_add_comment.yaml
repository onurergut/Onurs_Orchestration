interactions:
- request:
    body: '{"body": "Looks good to me"}'
    headers:
      Accept:
      - application/vnd.github+json
      Authorization:
      - Bearer test-token
      Content-Type:
      - application/json
      User-Agent:
      - orchestration-github-adapter
      X-GitHub-Api-Version:
      - '2022-11-28'
    method: POST
    uri: https://api.github.com/repos/example/repo/issues/123/comments
  response:
    body:
      string: '{"id":999,"body":"Looks good to me","user":{"login":"reviewer"},"created_at":"2024-04-01T00:00:00Z"}'
    headers:
      Content-Type:
      - application/json; charset=utf-8
    status:
      code: 201
      message: Created
version: 1
