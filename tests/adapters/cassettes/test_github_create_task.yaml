interactions:
- request:
    body: '{"title": "New issue", "body": "Body of new issue"}'
    headers:
      Accept:
      - application/vnd.github+json
      Authorization:
      - Bearer test-token
      Content-Type:
      - application/json
      User-Agent:
      - orchestration-github-adapter
      X-GitHub-Api-Version:
      - '2022-11-28'
    method: POST
    uri: https://api.github.com/repos/example/repo/issues
  response:
    body:
      string: '{"number":42,"title":"New issue","body":"Body of new issue","state":"open","html_url":"https://github.com/example/repo/issues/42","created_at":"2024-03-01T00:00:00Z","updated_at":"2024-03-01T00:00:00Z","user":{"login":"alice"},"labels":[]}'
    headers:
      Content-Type:
      - application/json; charset=utf-8
    status:
      code: 201
      message: Created
version: 1
